<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Send SMS - XuanVex">
    <meta property="og:description" content="Send SMS quickly and easily with the XuanVex communication interface.">
    <meta property="og:url" content="https://xuanvex.github.io/sms-application">
    <meta property="og:site_name" content="XuanVex">
    <meta property="og:image" content="./images/img.png">
    <meta name="theme-color" content="#2563eb">
    <meta name="color-scheme" content="light">
    <meta name="author" content="XuanVex">
    <meta name="keywords" content="SMS, Send SMS, XuanVex, Communication, Messaging, Texting">
    <meta name="description" content="Send SMS quickly and easily with the XuanVex communication interface.">
    <title>Send SMS - XuanVex</title>
    <link rel="icon" href="./images/img.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- From Uiverse.io by Gautammsharma --> 
<div class="grid-wrapper">
  <div class="grid-background"></div>
</div>

    <div class="sms">
        <div class="userUI">
            <img src="./images/img.png" width="100" height="100" alt="User Avatar">
            <div class="userInfo">
                <h2>XuanVex <i data-lucide="badge-check"></i> </h2>
                <p title="Open Webpage (XuanVex)" class="username">@xuanvex</p>
                <p class="chat-id"><span>Chat ID:</span> 123456789 <i data-value="12345678" id="copy-chat-id" title="Copy Chat ID"  data-lucide="copy"></i>  </p>
                <p class="status"> <span id="dot"></span>Online</p>
            </div>
        </div>
    </div>
    <div class="sms2">
        <div class="icon">
            <div class="box-icon">
                <i data-lucide="phone"></i> 
            </div>
            <span>PHONE NUMBER</span>
        </div>
        <div class="pad">
            <div class="number">
            <div class="code"><img width="20px" height="12px" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Flag_of_Bangladesh.svg/960px-Flag_of_Bangladesh.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20251214051007" /> +880</div>
            <input type="tel" placeholder="01XXXXXXXXX">
        </div>
        </div>
        <span class="devidor"></span>
        <div class="telecom">
            <div class="icon">
            <div class="box-icon">
                <i data-lucide="radio-tower"></i> 
            </div>
            <span>SIM / NETWORK</span>
        </div>
        <div class="pad">
            <select name="telecom" id="telecom">
                <option value="" disabled selected>Select a network</option>
                <option value="Grameenphone"><img width="20px" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Grameenphone_Logo_GP_Logo.svg/60px-Grameenphone_Logo_GP_Logo.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20210331210716" />Grameenphone</option>
                <option value="Robi"><img width="20" src="//upload.wikimedia.org/wikipedia/bn/thumb/c/ce/%E0%A6%B0%E0%A6%AC%E0%A6%BF_%E0%A6%86%E0%A6%9C%E0%A6%BF%E0%A6%AF%E0%A6%BC%E0%A6%BE%E0%A6%9F%E0%A6%BE%E0%A6%B0_%E0%A6%B2%E0%A7%8B%E0%A6%97%E0%A7%8B.svg/120px-%E0%A6%B0%E0%A6%AC%E0%A6%BF_%E0%A6%86%E0%A6%9C%E0%A6%BF%E0%A6%AF%E0%A6%BC%E0%A6%BE%E0%A6%9F%E0%A6%BE%E0%A6%B0_%E0%A6%B2%E0%A7%8B%E0%A6%97%E0%A7%8B.svg.png?utm_source=bn.wikipedia.org&utm_campaign=index&utm_content=thumbnail&_=20220302224142" />Robi</option>
                <option value="Banglalink"><img width="20px" src="https://images.seeklogo.com/logo-png/64/3/banglalink-logo-png_seeklogo-647949.png" />Banglalink</option>
                <option value="Airtel"><img width="20px" src="//upload.wikimedia.org/wikipedia/commons/thumb/8/81/Cirkle_logo.svg/120px-Cirkle_logo.svg.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" />Airtel/Circle</option>
                <option value="Teletalk"><img width="20px" src="	https://www.logo.wine/a/logo/TeleTalk/TeleTalk-Logo.wine.svg" />Teletalk</option>
            </select>
        </div>
    </div>


    <script>
        lucide.createIcons();
    </script>
    <script src="script.js"></script>

</body>
</html>
