<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send SMS - XuanVex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sms">
        <div class="userUI">
            <img src="./images/img.png" width="100" height="100" alt="User Avatar">
            <div class="userInfo">
                <h2>XuanVex <i data-lucide="badge-check"></i> </h2>
                <p class="username">@xuanvex</p>
                <p class="chat-id"><span>Chat ID:</span> 123456789 <i title="Copy Chat ID" data-set data-lucide="copy"></i>  </p>
                <p class="status"> <span id="dot"></span>Online</p>
            </div>
        </div>
    </div>


    <script>
        lucide.createIcons();
    </script>

</body>
</html>
