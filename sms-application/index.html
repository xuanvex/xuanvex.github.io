<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send SMS - XuanVex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- From Uiverse.io by Gautammsharma --> 
<div class="grid-wrapper">
  <div class="grid-background"></div>
</div>

    <div class="sms">
        <div class="userUI">
            <img src="./images/img.png" width="100" height="100" alt="User Avatar">
            <div class="userInfo">
                <h2>XuanVex <i data-lucide="badge-check"></i> </h2>
                <p title="Open Webpage (XuanVex)" class="username">@xuanvex</p>
                <p class="chat-id"><span>Chat ID:</span> 123456789 <i title="Copy Chat ID" data-set data-lucide="copy"></i>  </p>
                <p class="status"> <span id="dot"></span>Online</p>
            </div>
        </div>
    </div>
    <div class="sms2">
        <div class="icon">
            <div class="box-icon">
                <i data-lucide="phone"></i> 
            </div>
            <span>PHONE NUMBER</span>
        </div>
        <div class="number">
            <div class="code"><img width="20px" height="12px" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Flag_of_Bangladesh.svg/960px-Flag_of_Bangladesh.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20251214051007" /> +880</div>
            <input type="tel" placeholder="01XXXXXXXXX">
        </div>
    </div>


    <script>
        lucide.createIcons();
    </script>

</body>
</html>
