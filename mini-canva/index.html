<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form (XuanVex)</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
            padding: 0;
        }
        :root {
            --main-text-color: #202124;
            --secodary-text-color: #6b7280;
            --body: #f8f9fa;
            --border: #e5e7eb;
            --container-bg: white;
             --toogle: #202124;
        }
        .dark {
    --main-text-color: #f1f5f9;
    --secodary-text-color: #94a3b8;
    --body: #0f1115;
    --border: #272b33;
    --container-bg: #171a21;
    --toogle: #202124;
}
        body {
            width: 100%;
    
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 5px;
            padding: 20px;
            background: var(--body);
            color: var(--main-text-color);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            width: 100%;
            padding: 0 0;
            border: 1px solid var(--border);
            background-color: var(--container-bg);
            border-radius: 0.8rem;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            gap: 5px;
            padding-bottom: 20px;
            padding-top: 20px;
        }
        .container .head {
            width: 100%;
            text-align: center;
            padding: 0 20px;
        }
        .head h1 {
            font-size: 26px;
            letter-spacing: -1px;
            color: var(--main-text-color);
        }
        .head p {
            font-size: 15px;
            color: var(--secodary-text-color);
            font-weight: 400;
            line-height: 1.6;
        }
        .devider {
            width: 100%;
            height: 0.9px;
            background-color: var(--border);
        }
        .input-feilds {
            width: 100%;
            padding: 0 26px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .input label {
            font-size: 15px;
            line-height: 1.6;
            font-weight: 400;
            color: var(--main-text-color);
        }
        .input input {
            width: 100%;
            padding: 11px;
            outline: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--body);
            color: var(--main-text-color);
            &:hover, &:focus {
                border: 1px solid var(--secodary-text-color);
            }
        }
        .input textarea {
            width: 100%;
            padding: 20px;
            border: 1px solid var(--border);
            background-color: var(--body);
            color: var(--main-text-color);
            border-radius: 8px;
                        &:hover, &:focus {
                border: 1px solid var(--secodary-text-color);
            }
        }
        main {
            width: 100%;;
        }

        .inputt {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .inputt .file-input {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            border: 1px dashed var(--border);
            background-color: var(--body);
            padding: 16px;
            border-radius: 10px;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2 ease;
            &:hover {
                border: 1px dashed var(--main-text-color);
            }
             .file {
                width: 100%;
                position: absolute;
                top: 20%;
                opacity: 0;
            }
            .input-layout {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .input-layout span {
                border: 1px solid var(--border);
                padding: 5px;
                width: 40px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                background-color: var(--container-bg);
                border-radius: 8px;
                font-size:23px;
                color: var(--main-text-color);
                font-weight: 600;
            }
            .input-head {
                width: 100%;
                display: flex;
                align-items: center;
                flex-direction: space-between;
                gap: 15px;
            }
            .input-text strong {
                font-size: 14px;
                color: var(--main-text-color);
                font-weight: 500;
                display: block;
            }
            .input-text p {
                font-size: 12px;
                color: var(--secodary-text-color);
                margin-top: 3px;
            }
            .input-btn button {
                padding: 11px;
                background-color: var(--container-bg);
                outline: none;
                border: 1px solid var(--border);
                border-radius: 8px;
                font-weight: 500;
                color: var(--main-text-color);
            }

        }
        .upload-progress{
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;

        }
        .upload-progress img {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-size: contain;
        }
        .pr {
            width: 100%;
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 6px;
        }
        .progress-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 5px;
            font-size: 13px;
            color: var(--secodary-text-color);
        }
        .progress-bar {
            width: 100%;
            position: relative;
            height: 5px;
            background-color: var(--border);
            border-radius: 50px;
            overflow: hidden;
        }
        .progress-bar .progress {
            width: 0;
            background-color: var(--main-text-color);
            height: 100%;
            border-radius: inherit;
        }
        .upload {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }
        .img-name {
            width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toogle {
            width: 40px;
            height: 20px;
            border: 1px solid var(--border);
            background-color: var(--body);
            border-radius: 50px;
            text-align: center;
            position: relative;
            display: flex;
            align-items: center;
            padding: 2px;
            cursor: pointer;
        }
        .toogle span {
            width: 14px;
            height: 14px;
            background-color: var(--secodary-text-color);
            flex: 0 0 14px;
            border-radius: inherit;
            transition: transform 200ms ease-in-out,
                background-color 200ms ease-in-out;
            border: 1px solid var(--border);
        }
        .toogle:hover span {
            transform: scale(1.1);
        }
        .toogle.active span {
            transform: translateX(calc(100% + 2px));
            background-color: var(--container-bg);
            border: none;
        }
        .toogle.active {
            background-color: var(--toogle);
            border: none;
        } 
        .pri {
            width: 100%;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .pri label {
            width:100%;
        }
        .pri label strong {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: var(--main-text-color);
        }
        .pri label p {
            font-size: 13px;
            color: var(--secodary-text-color);
            letter-spacing: -0.1px;
        }
        .btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            
        }
        .btn button {
            width: 100%;
            padding: 11px;
            outline: none;
            border: none;
            background-color: var(--main-text-color);
            color: var(--body);
            font-weight: 600;
            font-family: inherit;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid var(--secodary-text-color);
            transition: 200ms all ease-in-out;
            &:hover {
                background-color: #535968;
                transform: scale(1.1);
            }
            &:active {
                transform: scale(0.93);
            }
        }

        [data-tooltip] {
            position: relative;
        }
        [data-tooltip]::after {
            content: attr(data-tooltip);
            font-size: 14px;
            display: flex;
            position: absolute;
            
            background-color: var(--body);
            color: var(--main-text-color);
            border-radius: 8px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            white-space: nowrap;
            left: 50%;
            bottom: calc(100% - 8px);
            transform: translateX(-50%) translateY(10px) scale(0.95);
            font-weight: 500;
            letter-spacing: -0.2px;
            opacity: 0;
            visibility: hidden;
            z-index: 9999;
            pointer-events: none;
            transition:
    opacity 180ms cubic-bezier(.4,0,.2,1),
    transform 180ms cubic-bezier(.4,0,.2,1);
        }
        [data-tooltip]:hover::after {
            opacity: 1;
            visibility: visible;
            bottom: 33px;
            transform: translateX(-50%) translateY(0) scale(1);
        }


        
    </style>
</head>
<body class="">
    <main>
        <div class="container">
            <div class="head">
                <h1>Contact With Us</h1>
                <p>Fill up the form to contact with us.</p>
            </div>
            <div class="devider"></div>
            <div class="input-feilds">
                <div class="input">
                    <label>Name <span style="color: red;">*</span></label>
                    <input type="text" placeholder="Your name...">
                </div>
                                <div class="input">
                    <label>E-mail <span style="color: red;">*</span></label>
                    <input type="text" placeholder="Your name...">
                </div>
                <div class="inputt">
                    <label>Images</label>
                    <div class="file-input" data-tooltip="Add Images">
                        <input class="file" type="file" accept="images/*" multiple>
                        <div class="input-layout">
                            <div class="input-head">
                                <div class="icon">
                                    <span>↑</span>
                                </div>
                                <div class="input-text">
                                    <strong>Upload images</strong>
                                    <p>PNG, JPEG, WEBP or GIF</p>
                                </div>
                            </div>
                            <div class="input-btn">
                                <button>Browse</button>
                            </div>
                        </div>
                    </div>
                    <div class="upload">

                    </div>
                </div>
                    <div class="input">
                    <label>Message <span style="color: red;">*</span></label>
                    <textarea placeholder="Message"></textarea>
                </div>
            </div>
            <div class="pri">
                <label for="">
                    <strong>Service running</strong>
                    <p>Turn On this toggle then your service will running</p>
                </label>
                <div data-tooltip="Turn on Service" class="toogle">
                <span></span>
            </div>
            </div>
                <div class="btn">
                          <button data-tooltip="Send Mail">Submit</button>
                </div>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
